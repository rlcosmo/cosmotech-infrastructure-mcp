[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cosmotech-infrastructure-mcp"
version = "0.1.0"
description = "Provider-neutral, read-only infrastructure MCP server for CosmoTech."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.35,<2",
  "fastmcp>=4,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
cosmotech-mcp = "cosmotech_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmotech_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
